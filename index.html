<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Analisa Satker -- Uji Coba Koneksi</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#1B2430;}
  h1{font-size:20px;}
  button{padding:10px 18px;font-size:14px;border-radius:8px;border:1px solid #ccc;background:#0F3B5C;color:#fff;cursor:pointer;}
  pre{background:#f5f6f8;padding:14px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:12px;}
</style>
</head>
<body>
  <h1>Uji Coba Koneksi Netlify &rarr; Google Sheets</h1>
  <p>Ini halaman sementara untuk memastikan Netlify Function bisa membaca sheet "Database" kamu lewat Service Account, sebelum kita lanjut membangun tampilan penuh.</p>
  <button id="btn">Ambil Daftar Satker</button>
  <pre id="out">(belum ditekan)</pre>
  <script>
    document.getElementById('btn').addEventListener('click', async function(){
      var out = document.getElementById('out');
      out.textContent = 'Memuat...';
      try {
        var resp = await fetch('/api/get-satker-list');
        var data = await resp.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    });
  </script>
</body>
</html>
